[tools]
# No specific tool versions required — uses system shell

# ─────────────────────────────────────────────────────────────────────────────
# Setup Tasks
# ─────────────────────────────────────────────────────────────────────────────

[tasks.setup-qwen-global]
description = "Create global Qwen Code skills symlinks (~/.qwen/skills/)"
run = """
#!/bin/bash
set -e
mkdir -p ~/.qwen/skills
cd ~/Workspace/.agents/skills/
for skill in */; do
    skill="${skill%/}"
    ln -sfn "$(pwd)/${skill}" ~/.qwen/skills/"${skill}"
done
echo "✓ Qwen Code global skills set up"
"""

[tasks.setup-qwen-workspace]
description = "Create workspace-level Qwen Code skills symlinks (~/Workspace/.qwen/skills/)"
run = """
#!/bin/bash
set -e
cd ~/Workspace/
mkdir -p .qwen/skills
for skill in .agents/skills/*/; do
    ln -sfn "../../.agents/skills/$(basename "${skill}")" .qwen/skills/"$(basename "${skill}")"
done
echo "✓ Qwen Code workspace skills set up"
"""

